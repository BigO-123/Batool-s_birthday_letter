<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter Awaits</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#ffe6ee; --rose:#f4a3c0; --pink:#e0457b; --berry:#a3195b; --lilac:#cdb4f6; --gold:#f0c36a; --plum:#4a1636; --film:#2b1230; --fw:180px; --fh:128px;
  --display:'UnifrakturCook','Old English Text MT',Georgia,serif;
  --body:'IM Fell English',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blush:#ffe6ee}}
:root[data-theme="dark"]{--blush:#ffe6ee}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--plum);font-family:var(--body);overflow-x:hidden;
  background:linear-gradient(160deg,#ffd9e6 0%,#f6c6e0 45%,#d9c4f7 100%)}
main{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,7vw,3.4rem);margin:0;color:var(--berry);text-shadow:0 2px 0 #fff9,0 0 28px #fff;line-height:1.1}
.sub{margin:0;font-size:1.2rem;font-style:italic;max-width:30rem;line-height:1.5;text-shadow:0 0 14px #ffe6ee}
#count{display:flex;gap:clamp(10px,3vw,20px);flex-wrap:wrap;justify-content:center}
.u{min-width:76px;padding:12px 8px;border:2px solid var(--rose);border-radius:14px;background:#fff8fbd9;box-shadow:0 6px 18px #a3195b26}
.u b{display:block;font-family:var(--display);font-size:2.3rem;color:var(--pink);font-weight:700}
.u span{font-size:.95rem;font-style:italic}
/* film strips */
.film{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.film::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#ffe6eed9 0,#ffe6ee8c 38%,#ffe6ee00 78%)}
.tilt{position:absolute;left:-30%;right:-30%;top:-30%;bottom:-30%;transform:rotate(-5deg);display:flex;flex-direction:column;justify-content:center;opacity:.62}
.reel{position:relative;display:flex;width:max-content;flex:none;padding:20px 0;background:var(--film);border-bottom:2px solid #0006;animation:rollA 80s linear infinite}
.reel.r{animation-direction:reverse}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:9px;
  background:repeating-linear-gradient(90deg,#ffe6ee 0 14px,transparent 14px 28px);opacity:.85}
.reel::before{top:5px}.reel::after{bottom:5px}
.fr{width:var(--fw);height:var(--fh);margin:0 9px;flex:none;background:#000;overflow:hidden;border-radius:2px;display:grid;place-items:center;font-size:calc(var(--fh)*.42)}
.fr img{width:100%;height:100%;object-fit:cover;filter:sepia(.45) saturate(1.2) contrast(1.05)}
@keyframes rollA{to{transform:translateX(-50%)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.16;mix-blend-mode:multiply;animation:flick .5s steps(2) infinite;
  background:repeating-radial-gradient(circle at 20% 30%,#0000 0 2px,#4a163655 3px 3px),repeating-linear-gradient(0deg,#0000 0 3px,#4a16361a 4px)}
@keyframes flick{50%{transform:translate(-3px,2px)}}
/* envelope */
.stage{position:relative;width:min(330px,86vw);height:min(225px,59vw);perspective:900px}
.env{position:absolute;inset:0;cursor:default;background:none;border:0;padding:0;font:inherit}
.env.ready{cursor:pointer;animation:glow 2.4s ease-in-out infinite}
.env:focus-visible{outline:3px solid var(--pink);outline-offset:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #ff6fa8cc)}}
.back,.front{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#fff1f5,#f7c9da)}
.back{box-shadow:0 18px 40px #7a1d4a55}
.front{clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);background:linear-gradient(180deg,#fadbe6,#eeb0c8)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#f6c3d6,#e9a3bf);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:3}
.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#ff7fae,var(--berry));box-shadow:0 4px 10px #5a0f3399,inset 0 0 0 4px #ffffff30;
  display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;color:#ffe9b8;transition:transform .4s,opacity .4s}
.open .seal{transform:scale(1.6);opacity:0}
.locked .seal{filter:grayscale(.55) brightness(.9)}
.hint{margin:0;font-style:italic;min-height:1.4em;text-shadow:0 0 12px #ffe6ee}
/* celebration */
#fx{position:fixed;inset:0;z-index:8;pointer-events:none}
.float{position:fixed;bottom:-70px;z-index:9;pointer-events:none;animation:rise var(--t) ease-in forwards}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(var(--r))}}
#cheer{position:fixed;left:0;right:0;top:22%;z-index:9;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(2.2rem,9vw,4.6rem);
  color:var(--berry);text-shadow:0 0 0 #fff,0 3px 0 #fff,0 0 30px #fff;opacity:0}
#cheer.go{animation:pop 2.4s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}20%{opacity:1;transform:scale(1.1) rotate(2deg)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* letter */
#veil{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:#4a1636b8;z-index:10}
#veil.show{display:flex}
.paper{width:min(640px,100%);max-height:100%;overflow-y:auto;padding:clamp(28px,6vw,54px) clamp(24px,6vw,50px);text-align:left;color:var(--plum);
  background:radial-gradient(ellipse at center,#fffaf2 0%,#fde9ee 62%,#f6cfdc 100%);border-radius:4px;
  box-shadow:0 0 0 2px var(--rose),0 0 0 9px #ffffff55,0 30px 70px #3a0d29;animation:unroll .9s cubic-bezier(.2,.8,.2,1)}
@keyframes unroll{from{transform:scale(.35) translateY(60px);opacity:0}to{transform:none;opacity:1}}
.paper h2{font-family:var(--display);font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 18px;color:var(--pink);font-weight:700}
.paper p{font-size:clamp(1.05rem,3.4vw,1.28rem);line-height:1.7;margin:0 0 14px}
.paper .sig{font-family:var(--display);font-size:1.7rem;text-align:right;margin-top:26px;color:var(--berry)}
.close{display:block;margin:22px auto 0;background:none;border:1.5px solid var(--berry);color:var(--berry);font:inherit;padding:6px 20px;border-radius:20px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.reel,.grain,.env.ready,.paper{animation:none}.flap{transition:none}}
.env{-webkit-tap-highlight-color:transparent}
.paper{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (max-width:600px){
  :root{--fw:118px;--fh:84px}
  main{gap:20px;padding:20px 14px}
  #count{flex-wrap:nowrap;width:100%;max-width:380px;gap:8px}
  .u{min-width:0;flex:1 1 0;padding:10px 2px;border-radius:12px}
  .u b{font-size:1.65rem}.u span{font-size:.78rem}
  .sub{font-size:1.08rem}
  .seal{width:56px;height:56px;margin:-28px 0 0 -28px}
  .paper p{line-height:1.6}
}
@media (max-height:520px) and (orientation:landscape){main{flex-direction:row;flex-wrap:wrap;gap:14px}.stage{width:220px;height:150px}}
</style>
</head>
<body>
<div class="film" aria-hidden="true"><div class="tilt" id="tilt"></div></div>
<div class="grain" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="cheer" aria-hidden="true">Happy Birthday!</div>
<main>
  <h1 id="title">A Letter Awaits</h1>
  <p class="sub" id="sub"></p>
  <div id="count" aria-live="polite"></div>
  <div class="stage">
    <button class="env locked" id="env" aria-label="Sealed letter" disabled>
      <div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal" id="sealTxt">&#10022;</div>
    </button>
  </div>
  <p class="hint" id="hint"></p>
</main>
<div id="veil" role="dialog" aria-modal="true" aria-label="Your letter"><div class="paper" id="paper"></div></div>

  const probe = document.createElement("div"); probe.className = "reel"; probe.innerHTML = frames.join(""); t.appendChild(probe);
  const setW = probe.scrollWidth || 1, rowH = probe.offsetHeight || 1;
  const copies = Math.max(2, Math.ceil(innerWidth*1.7/setW)*2);
  const rows = Math.ceil(innerHeight*1.7/rowH) + 1;
  t.innerHTML = "";
  for(let i=0;i<rows;i++){
    const r = document.createElement("div"); r.className = "reel" + (i%2 ? " r" : "");
    r.style.animationDuration = (70+(i%3)*14)+"s"; r.style.animationDelay = -(i*11)+"s";
    r.innerHTML = (i%2 ? frames.slice().reverse() : frames).join("").repeat(copies);
    t.appendChild(r);
  }
}
buildFilm();
let rt; addEventListener("resize", () => { if (innerWidth === lastW) return; clearTimeout(rt); rt = setTimeout(buildFilm, 250); });

function unlock(){
  if (ready) return; ready = true;
  const e = $("env"); e.disabled = false; e.classList.remove("locked"); e.classList.add("ready");
  e.setAttribute("aria-label","Sealed letter. Open it");
  $("title").textContent = `Happy Birthday, ${CONFIG.name}`;
  $("sub").textContent = "The hour hath come. Thy letter is ready.";
  $("count").style.display = "none";
  $("hint").textContent = "Tap the seal to open the letter";
}
function tick(){
  const d = target - Date.now();
  if (d <= 0 || preview){ unlock(); return; }
  const s = Math.floor(d/1000), p = n => String(n).padStart(2,"0");
  const parts = [["Days",Math.floor(s/86400)],["Hours",Math.floor(s%86400/3600)],["Minutes",Math.floor(s%3600/60)],["Seconds",s%60]];
  $("count").innerHTML = parts.map(([l,v]) => `<div class="u"><b>${l==="Days"?v:p(v)}</b><span>${l}</span></div>`).join("");
  $("hint").textContent = "The seal holds fast until her birthday";
  setTimeout(tick, 1000);
}
tick();

/* celebration */
const cv = $("fx"), ctx = cv.getContext("2d");
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
size(); addEventListener("resize", size);
const cols = ["#ff6fa8","#f4a3c0","#cdb4f6","#f0c36a","#ffffff","#a3195b","#9fd8f0"];
let bits = [], raf = 0;
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 4+Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:140+Math.random()*60,heart:Math.random()<.2});
  }
  if(!raf) draw();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b => b.life-- > 0 && b.y < cv.height+30);
  for(const b of bits){
    b.vy += .22; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.globalAlpha = Math.min(1,b.life/40);
    if(b.heart){ ctx.font = "18px serif"; ctx.fillText("♥",-6,6); } else ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
    ctx.restore();
  }
  raf = bits.length ? requestAnimationFrame(draw) : 0;
  if(!raf) ctx.clearRect(0,0,cv.width,cv.height);
}
function balloons(){
  const set = ["🎈","🎈","🎈","🎀","💖","🎉","✨","🌸"];
  for(let i=0;i<24;i++){
    const el = document.createElement("div"); el.className = "float"; el.textContent = set[i%set.length];
    el.style.cssText = `left:${Math.random()*92}vw;font-size:${28+Math.random()*34}px;--t:${2.6+Math.random()*1.8}s;--dx:${(Math.random()-.5)*120}px;--r:${(Math.random()-.5)*40}deg;animation-delay:${Math.random()*.9}s`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 5500);
  }
}
function celebrate(){
  const r = $("env").getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
  if(calm) return;
  burst(x,y,110); balloons();
  $("cheer").classList.remove("go"); void $("cheer").offsetWidth; $("cheer").classList.add("go");
  setTimeout(() => burst(innerWidth*.2,innerHeight*.5,60), 700);
  setTimeout(() => burst(innerWidth*.8,innerHeight*.5,60), 1100);
  setTimeout(() => burst(x,y,70), 1700);
}

/* letter */
const [greet, ...rest] = CONFIG.letter;
$("paper").innerHTML = `<h2></h2>${rest.map(()=>"<p></p>").join("")}<div class="sig"></div><button class="close">Fold the letter</button>`;
const ps = $("paper").querySelectorAll("p");
$("paper").querySelector("h2").textContent = greet;
rest.forEach((t,i)=>ps[i].textContent = t);
$("paper").querySelector(".sig").textContent = CONFIG.from;

$("env").addEventListener("click", () => {
  if (!ready || opened) return; opened = true;
  $("env").classList.add("open");
  setTimeout(celebrate, 500);
  setTimeout(() => $("veil").classList.add("show"), calm ? 900 : 3200);
});
function fold(){ $("veil").classList.remove("show"); $("env").classList.remove("open"); opened = false; }
$("paper").querySelector(".close").addEventListener("click", fold);
$("veil").addEventListener("click", e => { if (e.target === $("veil")) fold(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fold(); });
</script>
